name: OBD read-only firmware CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run native allowlist tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/ObdDisplay tests/test_read_only_policy.cpp -o /tmp/obd-policy-test
          /tmp/obd-policy-test

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32-S3 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.2 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Install display libraries
        run: |
          arduino-cli lib install "GFX Library for Arduino"
          arduino-cli lib install "Adafruit CST8XX Library"
          arduino-cli lib install "Adafruit PCF8574"
          arduino-cli lib install "lvgl@8.3.11"
      - name: Offline display build (no WLAN)
        run: |
          test ! -f firmware/ObdDisplay/Config.h
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB' --build-path /tmp/obd-offline firmware/ObdDisplay
      - name: Connected code path compile (dummy config; never flash)
        run: |
          cp firmware/ObdDisplay/Config.h.example firmware/ObdDisplay/Config.h
          trap 'rm -f firmware/ObdDisplay/Config.h' EXIT
          arduino-cli compile --fqbn 'esp32:esp32:esp32s3:FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB' --build-path /tmp/obd-connected firmware/ObdDisplay
