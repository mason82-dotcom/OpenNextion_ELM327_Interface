name: OBD read-only firmware CI
on:
  push:
  pull_request:
  workflow_dispatch:

# Each source update supersedes its predecessor; compile only the latest
# revision on each branch/PR instead of queuing dozens of ESP32 toolchains.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run native allowlist and PID parser tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/ObdDisplay tests/test_read_only_policy.cpp -o /tmp/obd-policy-test
          /tmp/obd-policy-test
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/ObdDisplay tests/test_obd_response_parser.cpp -o /tmp/obd-parser-test
          /tmp/obd-parser-test
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/ObdDisplay tests/test_obd_pid_catalog.cpp -o /tmp/obd-pid-catalog-test
          /tmp/obd-pid-catalog-test
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/ObdDisplay tests/test_obd_diagnostics.cpp -o /tmp/obd-diagnostics-test
          /tmp/obd-diagnostics-test
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/ObdDisplay tests/test_obd_iso_tp.cpp -o /tmp/obd-iso-tp-test
          /tmp/obd-iso-tp-test
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/ObdDisplay tests/test_fuel_trim.cpp -o /tmp/obd-fuel-trim-test
          /tmp/obd-fuel-trim-test
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/ObdDisplay tests/test_poll_scheduler.cpp -o /tmp/obd-poll-scheduler-test
          /tmp/obd-poll-scheduler-test
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/ObdDisplay tests/test_sd_log_format.cpp -o /tmp/obd-sd-log-test
          /tmp/obd-sd-log-test
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/ObdDisplay tests/test_vehicle_profile.cpp -o /tmp/obd-vehicle-profile-test
          /tmp/obd-vehicle-profile-test
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/ObdDisplay tests/test_rtc8563.cpp -o /tmp/obd-rtc-test
          /tmp/obd-rtc-test
          g++ -std=c++17 -Wall -Wextra -Werror -Ifirmware/ObdDisplay tests/test_obd_transaction.cpp -o /tmp/obd-transaction-test
          /tmp/obd-transaction-test
